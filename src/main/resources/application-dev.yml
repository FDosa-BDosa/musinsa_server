spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: localhost:9092
  rabbitmq:
    host: ${RABBIT_HOST}
    port: 61613
    username: guest
    password: guest
    listener:
      simple:
        concurrency: 4     # 기본 1
        max-concurrency: 16
        prefetch: 20
  hikari:
    maximum-pool-size: 70
    minimum-idle: 10
    idle-timeout: 600000
    max-lifetime: 1800000
    connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

tosspayments:
  secret-key: test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6
  client-key: test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm
  confirm_url: http://localhost:8080/dummy-toss-confirm
  base_cancel_url: http://localhost:8080/dummy-toss-fail

fcm:
  service-account-file: key/fdbdproject.json
  topic-name: fdbdMessage
  project-id: fdbdproject

aws:
  s3:
    bucket: ${S3_BUCKET}
    accessKey: ${S3_ACCESS_KEY}
    secretKey: ${S3_SECRET_KEY}

server:
  port: 8080
  address: 0.0.0.0
  tomcat:
    max-connections: 50000
    accept-count: 4096
    threads:
      max: 400

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info, env

  tracing:
    enabled: true
    sampling:
      probability: 1.0

